name: Release DMG

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Security Gate (Check Secrets)
        run: |
          chmod +x scripts/check_secrets.sh
          ./scripts/check_secrets.sh --all

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build and Package Universal DMG
        run: |
          chmod +x scripts/bundle_dmg.sh
          ./scripts/bundle_dmg.sh --universal

      - name: Extract Release Notes from CHANGELOG.md
        id: release_notes
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          # Extract notes for this version from CHANGELOG.md
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release_notes.md || true
          if [ ! -s release_notes.md ]; then
            echo "Release $TAG_NAME" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*.dmg
          draft: false
          prerelease: false
